services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.io}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    env_file:
      - ".env"
    # S001-NFR-005 Phase 3: container-run overrides for two .env values that
    # only make sense for the host-run case. These take precedence over the
    # values pulled from env_file:
    #   - LITELLM_PROXY_URL: localhost:4000 → host.docker.internal:4000 so the
    #     containerised backend can reach the LiteLLM proxy that itself runs
    #     in a separate compose project. Resolves via extra_hosts → host-gateway
    #     on Linux/WSL2 (no-op on macOS/Windows where Docker Desktop maps it).
    #   - DOCUMENTS_PATH: public/documents → /var/app/documents so uploaded files
    #     land in the documents-data volume mount, not in /app/public/documents
    #     (which is outside any volume and would be lost on container recreate).
    environment:
      LITELLM_PROXY_URL: "http://host.docker.internal:4000"
      DOCUMENTS_PATH: "/var/app/documents"
      # S001-NFR-008: enable per-case conversation history so chat feels
      # continuous (was off by default in config.py). Override to "false"
      # in your local env if you want to A/B test without history.
      ENABLE_CHAT_HISTORY: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - documents-data:/var/app/documents
      - cases-data:/app/backend/data/contexts/cases
      - manifest-data:/app/backend/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    healthcheck:
      # S001-NFR-005 closed-environment workaround: replaces `curl -f http://...`.
      # The image no longer ships curl (the apt step that installed it is removed
      # because deb.debian.org is unreachable in closed networks). Python is
      # already in the image, so urllib does the same job:
      # `urllib.request.urlopen(...)` raises on any non-2xx → exit non-zero (unhealthy).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.io}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org/}"
        # S001-NFR-005 Phase 1.5: empty default → SPA emits relative URLs
        # which the nginx reverse proxy forwards to ${BACKEND_HOST}:${BACKEND_PORT}.
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    environment:
      # S001-NFR-005 Phase 1.5: nginx upstream is templated at container start
      # via envsubst on /etc/nginx/templates/default.conf.template. Override
      # these in k8s Deployment env to repoint at backend.<ns>.svc.cluster.local.
      BACKEND_HOST: "backend"
      BACKEND_PORT: "8000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    restart: unless-stopped

  ollama:
    image: "${DOCKER_REGISTRY:-docker.io}/ollama/ollama:latest"
    profiles:
      - ollama
    volumes:
      - ollama-data:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - "ollama serve & OLLAMA_PID=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${LITELLM_OLLAMA_MODEL:-gemma3:12b}; wait $$OLLAMA_PID"
    restart: unless-stopped

volumes:
  documents-data:
  cases-data:
  manifest-data:
  ollama-data:
